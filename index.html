<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>門診時段交叉查詢與醫師代碼查詢系統</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --success-bg: #ecfdf5;
      --success-border: #10b981;
      --success-text: #065f46;
      --warn-bg: #fffbeb;
      --warn-border: #f59e0b;
      --warn-text: #92400e;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --radius: 10px;
      --shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, #0f172a, #0369a1);
      color: white;
      padding: 18px 16px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    header h1 { font-size: 1.3rem; margin-bottom: 2px; }
    header p { font-size: 0.82rem; opacity: 0.88; }

    .container {
      max-width: 960px;
      margin: 14px auto;
      padding: 0 12px;
    }

    /* 頁籤 */
    .nav-tabs {
      display: flex;
      background: #e2e8f0;
      border-radius: var(--radius);
      padding: 4px;
      gap: 6px;
      margin-bottom: 14px;
    }
    .nav-tab {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: transparent;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .nav-tab.active {
      background: white;
      color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid #e2e8f0;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 8px;
    }

    .form-group { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: white;
      outline: none;
      color: var(--text);
    }
    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 600px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .selector-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }
    @media (max-width: 600px) {
      .selector-row { grid-template-columns: 1fr; }
    }

    .search-bar-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .search-bar-wrap input {
      flex: 1;
    }

    .chip-box {
      max-height: 220px;
      overflow-y: auto;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f8fafc;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      font-size: 0.86rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }
    .chip input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .chip.selected {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
      font-weight: 700;
    }

    .btn-main {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-main:active { background: var(--primary-dark); }

    .btn-add {
      background: #0284c7;
      color: white;
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
      transition: background 0.2s;
    }
    .btn-add:hover { background: var(--primary-dark); }

    .btn-reset {
      white-space: nowrap;
      background: #f1f5f9;
      color: #475569;
      border: 1.5px solid #cbd5e1;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-reset:hover {
      background: #e2e8f0;
      color: #1e293b;
    }

    /* 已選取標籤清單 */
    .selected-docs-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 42px;
      padding: 8px;
      background: #f1f5f9;
      border-radius: 8px;
      border: 1px dashed #cbd5e1;
      margin-bottom: 12px;
      align-items: center;
    }
    .selected-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: #0284c7;
      color: white;
      border-radius: 16px;
      font-size: 0.84rem;
      font-weight: 700;
    }
    .selected-tag.base {
      background: #0f766e;
    }
    .selected-tag span.close-btn {
      cursor: pointer;
      font-weight: bold;
      margin-left: 4px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }
    .selected-tag span.close-btn:hover { background: rgba(255,255,255,0.45); }

    /* 結果卡片 */
    .result-section { margin-top: 16px; }
    .day-block {
      background: white;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    .day-header {
      background: #f1f5f9;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 0.92rem;
      color: #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
    }
    .day-body { padding: 12px 14px; }

    .slot-group {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #e2e8f0;
    }
    .slot-group:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .slot-title {
      font-weight: 700;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .badge-same-time {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.76rem;
      font-weight: 700;
    }
    .badge-diff-time {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.76rem;
    }

    .doc-tag {
      display: inline-block;
      margin: 3px 6px 3px 0;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 0.86rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }
    .doc-tag.match {
      background: #f0fdf4;
      border-color: #86efac;
      color: #14532d;
      font-weight: 700;
    }

    .dept-code {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-right: 4px;
      font-family: monospace;
    }
    .doc-code-tag {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-left: 4px;
      font-family: monospace;
    }

    /* 代碼速查樣式 */
    .dept-header-box {
      display: none;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding: 10px 14px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
    }
    .dept-title { font-size: 1rem; font-weight: 700; color: #1e3a8a; }
    .dept-code-tag-big {
      font-family: monospace;
      font-size: 0.95rem;
      font-weight: 700;
      background: #2563eb;
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .doctor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .doc-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 4px solid #2563eb;
      padding: 10px 14px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .doc-item:hover {
      background: #eff6ff;
      border-color: #3b82f6;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
      transform: translateY(-1px);
    }
    .doc-name { font-weight: 600; color: #1e293b; }
    .doc-code {
      font-family: monospace;
      font-weight: bold;
      background: #dbeafe;
      color: #1e40af;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    .doc-code.empty { background: #f1f5f9; color: #94a3b8; font-size: 0.8rem; }

    .empty-tip {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* 門診時刻表彈窗樣式 (Modal) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(2px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 520px;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      animation: modalFadeIn 0.2s ease-out;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-header {
      background: linear-gradient(135deg, #0f172a, #0369a1);
      color: white;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .modal-close-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .modal-close-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }
    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-footer {
      padding: 10px 18px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      text-align: right;
    }
    .btn-modal-close {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-modal-close:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <header>
    <h1>門診時段交叉查詢與醫師代碼查詢系統</h1>
    <p>排班交叉查詢・跨科同時段對照・醫師及科別代碼整合</p>
  </header>

  <div class="container">

    <!-- 頁籤 -->
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showTab('tab-cross', this)">門診 vs 跨科同時段</button>
      <button class="nav-tab" onclick="showTab('tab-codes', this)">醫師/科別代碼查詢</button>
    </div>

    <!-- ==================== 功能 1: 某科別醫師門診時段 vs 其他科別同時段醫師查詢 ==================== -->
    <div id="tab-cross" class="tab-pane">
      <div class="card">
        <div class="card-title">某科別醫師門診時段 vs 其他科別同時段醫師查詢</div>

        <!-- 基準醫師選擇 -->
        <label>1. 選擇基準醫師：</label>
        <div class="grid-2">
          <div class="form-group">
            <select id="cross-base-dept-select" onchange="onCrossBaseDeptChanged()">
              <!-- Dynamic options -->
            </select>
          </div>
          <div class="form-group">
            <select id="cross-base-doc-select" onchange="onCrossBaseDocSelected()">
              <!-- Dynamic options -->
            </select>
          </div>
        </div>

        <hr style="border:none; border-top:1px dashed #cbd5e1; margin:10px 0 14px 0;">

        <!-- 比對目標：科別 + 醫師下拉選單 ＋ 加入比對名單 -->
        <label>2. 選擇比對科別或醫師：</label>
        <div class="grid-2">
          <div class="form-group">
            <select id="cross-target-dept-select" onchange="onCrossTargetDeptChanged()">
              <!-- Dynamic options -->
            </select>
          </div>
          <div class="form-group">
            <select id="cross-target-doc-select">
              <!-- Dynamic options -->
            </select>
          </div>
        </div>

        <button type="button" class="btn-add" onclick="addCrossAllSelectedFromDropdown()">＋ 加入比對名單</button>

        <div class="form-group">
          <label>已加入之比對名單：</label>
          <div id="cross-selected-tags" class="selected-docs-list">
            <span style="color:#94a3b8; font-size:0.85rem;">尚未加入比對名單</span>
          </div>
        </div>

        <div style="display:flex; gap:8px; margin-top:14px;">
          <button class="btn-main" onclick="runCrossSearch()">查詢同時段醫師</button>
          <button type="button" onclick="clearCrossTargets()" style="width:100px; background:#e2e8f0; color:#334155; border:none; border-radius:8px; font-weight:700; cursor:pointer;">清空</button>
        </div>
      </div>

      <div id="cross-result-area" class="result-section"></div>
    </div>

    <!-- ==================== 功能 2: 醫師/科別代碼速查 ==================== -->
    <div id="tab-codes" class="tab-pane" style="display:none;">
      <div class="card">
        <div class="card-title">科別與醫師代碼速查</div>
        <label for="codeDeptSelect">選擇科別：</label>
        <select id="codeDeptSelect">
          <option value="">-- 請選擇科別 --</option>
        </select>

        <div id="deptHeaderBox" class="dept-header-box">
          <div class="dept-title" id="dispDeptName">-</div>
          <div>科別代碼：<span class="dept-code-tag-big" id="dispDeptCode">-</span></div>
        </div>

        <div class="doctor-grid" id="doctorContainer">
          <div class="empty-tip" style="grid-column: 1 / -1;">請選擇科別</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">醫師代碼與姓名搜尋</div>
        <label for="codeKeywordSearch">搜尋：</label>
        <div class="search-bar-wrap" style="margin-bottom:10px;">
          <input type="text" id="codeKeywordSearch" placeholder="搜尋醫師姓名、代碼或科別代碼...">
          <button type="button" class="btn-reset" onclick="resetCodeSearch()">清除搜尋並還原</button>
        </div>

        <div class="doctor-grid" id="searchResultContainer" style="display: none;"></div>
      </div>
    </div>

  </div>

  <!-- 醫師門診時刻表彈窗 (Modal) -->
  <div id="scheduleModal" class="modal-overlay" onclick="onModalOverlayClicked(event)">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="modalDoctorTitle">👨‍⚕️ 醫師門診時刻表</div>
        <button type="button" class="modal-close-btn" onclick="closeDoctorScheduleModal()">✕</button>
      </div>
      <div class="modal-body" id="modalDoctorContent">
        <!-- Dynamic schedule content -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-modal-close" onclick="closeDoctorScheduleModal()">關閉</button>
      </div>
    </div>
  </div>

  <script>
    // 時段名稱格式化修正（將「夜診診」修正為正確的「夜診」）
    function formatSlot(slot) {
      if (!slot) return "";
      if (slot.includes("夜診")) return "夜診";
      return slot.endsWith("診") ? slot : (slot + "診");
    }

    // 樣式更新輔助函數
    function toggleChipStyle(checkbox) {
      if (!checkbox) return;
      const parent = checkbox.parentElement;
      if (!parent) return;
      if (checkbox.checked) {
        parent.classList.add("selected");
      } else {
        parent.classList.remove("selected");
      }
    }

    // 頁籤切換
    function showTab(tabId, btnElement) {
      document.querySelectorAll(".tab-pane").forEach(el => el.style.display = "none");
      document.querySelectorAll(".nav-tab").forEach(el => el.classList.remove("active"));
      const targetPane = document.getElementById(tabId);
      if (targetPane) targetPane.style.display = "block";
      if (btnElement) {
        btnElement.classList.add("active");
      }
    }

    // 醫師主檔資料（已更新 (0262)陳詩典）
    const masterData = [

      { dept: "心臟內科", deptCode: "AB", doc: "王彥翔", docCode: "1502" },
      { dept: "心臟內科", deptCode: "AB", doc: "李學林", docCode: "1508" },
      { dept: "胸腔內科", deptCode: "AC", doc: "黃伊文", docCode: "0274" },
      { dept: "胸腔內科", deptCode: "AC", doc: "林澤宏", docCode: "0029" },
      { dept: "胸腔內科", deptCode: "AC", doc: "張子晏", docCode: "0027" },
      { dept: "胸腔內科", deptCode: "AC", doc: "佘養豪", docCode: "0035" },
      { dept: "胸腔內科", deptCode: "AC", doc: "高劍虹", docCode: "" },
      { dept: "腎臟內科", deptCode: "AD", doc: "黃耀宣", docCode: "0286" },
      { dept: "腎臟內科", deptCode: "AD", doc: "蔡旻叡", docCode: "1601" },
      { dept: "腎臟內科", deptCode: "AD", doc: "張淑鈺", docCode: "1604" },
      { dept: "腎臟內科", deptCode: "AD", doc: "吳佶育", docCode: "0268" },

    function getAllDepts() {
      const map = new Map();
      schedules.forEach(s => {
        if (!map.has(s.dept_code)) {
          map.set(s.dept_code, { code: s.dept_code, name: s.dept_name });
        }
      });
      return Array.from(map.values()).sort((a,b) => a.code.localeCompare(b.code));
    }

    function getDocsByDept(dept_code) {
      const set = new Set();
      schedules.filter(s => s.dept_code === dept_code).forEach(s => set.add(s.doctor));
      return Array.from(set);
    }

    function getAllDoctors() {
      const map = new Map();
      schedules.forEach(s => {
        const key = `${s.dept_code}___${s.doctor}`;
        if (!map.has(key)) {
          const docCode = findDocCode(s.doctor);
          map.set(key, { key, code: s.dept_code, dept: s.dept_name, doctor: s.doctor, docCode });
        }
      });
      return Array.from(map.values()).sort((a,b) => a.doctor.localeCompare(b.doctor, "zh-TW"));
    }

    // ==================== 功能 1: 某科別醫師門診時段 vs 其他科別同時段醫師查詢 ====================
    let crossBaseDoctorKey = ""; // 儲存基準醫師 key
    let crossSelectedTargets = new Set(); // 儲存目標 "DEPT_08" 或 "DOC_08___林憲治"

    function initCrossTab() {
      const depts = getAllDepts();

      // 基準科別
      const baseDeptSelect = document.getElementById("cross-base-dept-select");
      baseDeptSelect.innerHTML = "";
      depts.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d.code;
        opt.textContent = `[${d.code}] ${d.name}`;
        baseDeptSelect.appendChild(opt);
      });
      onCrossBaseDeptChanged();

      // 比對目標科別
      const targetDeptSelect = document.getElementById("cross-target-dept-select");
      targetDeptSelect.innerHTML = "";
      depts.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d.code;
        opt.textContent = `[${d.code}] ${d.name}`;
        targetDeptSelect.appendChild(opt);
      });
      onCrossTargetDeptChanged();
    }

    function onCrossBaseDeptChanged() {
      const deptCode = document.getElementById("cross-base-dept-select").value;
      const docSelect = document.getElementById("cross-base-doc-select");
      docSelect.innerHTML = "";
      const docs = getDocsByDept(deptCode);
      docs.forEach(doc => {
        const docCode = findDocCode(doc);
        const opt = document.createElement("option");
        opt.value = `${deptCode}___${doc}`;
        opt.textContent = docCode ? `${doc} (${docCode})` : doc;
        docSelect.appendChild(opt);
      });
      onCrossBaseDocSelected();
    }

    function onCrossBaseDocSelected() {
      const docSelect = document.getElementById("cross-base-doc-select");
      if (docSelect) {
        crossBaseDoctorKey = docSelect.value;
      }
      renderCrossTargetTags();
      if (crossSelectedTargets.size > 0) {
        runCrossSearch();
      }
    }

    function onCrossTargetDeptChanged() {
      const deptCode = document.getElementById("cross-target-dept-select").value;
      const docSelect = document.getElementById("cross-target-doc-select");
      docSelect.innerHTML = "";

      const optAll = document.createElement("option");
      optAll.value = "";
      optAll.textContent = "-- 全科所有醫師 --";
      docSelect.appendChild(optAll);

      const docs = getDocsByDept(deptCode);
      docs.forEach(doc => {
        const docCode = findDocCode(doc);
        const opt = document.createElement("option");
        opt.value = `${deptCode}___${doc}`;
        opt.textContent = docCode ? `${doc} (${docCode})` : doc;
        docSelect.appendChild(opt);
      });
    }

    // 基準醫師及選擇比對目標選好後，按「＋ 加入比對名單」後一起帶入已加入之比對名單
    function addCrossAllSelectedFromDropdown() {
      const baseDocKey = document.getElementById("cross-base-doc-select").value;
      if (baseDocKey) {
        crossBaseDoctorKey = baseDocKey;
      }

      const deptCode = document.getElementById("cross-target-dept-select").value;
      const docKey = document.getElementById("cross-target-doc-select").value;

      if (!docKey) {
        crossSelectedTargets.add(`DEPT_${deptCode}`);
      } else {
        crossSelectedTargets.add(`DOC_${docKey}`);
      }

      renderCrossTargetTags();
      runCrossSearch();
    }

    function removeCrossTarget(key) {
      crossSelectedTargets.delete(key);
      renderCrossTargetTags();
      runCrossSearch();
    }

    function clearCrossBaseDoctor() {
      crossBaseDoctorKey = "";
      renderCrossTargetTags();
      document.getElementById("cross-result-area").innerHTML = "";
    }

    function renderCrossTargetTags() {
      const container = document.getElementById("cross-selected-tags");
      if (!crossBaseDoctorKey && crossSelectedTargets.size === 0) {
        container.innerHTML = `<span style="color:#94a3b8; font-size:0.85rem;">尚未加入比對名單</span>`;
        return;
      }
      container.innerHTML = "";
      const allDepts = getAllDepts();

      // 基準醫師標籤
      if (crossBaseDoctorKey) {
        const [bCode, bDoc] = crossBaseDoctorKey.split("___");
        const bDocCode = findDocCode(bDoc);
        const baseTag = document.createElement("div");
        baseTag.className = "selected-tag base";
        baseTag.innerHTML = `[基準醫師] [${bCode}] ${bDoc} ${bDocCode ? `(${bDocCode})` : ''} <span class="close-btn" onclick="clearCrossBaseDoctor()">✕</span>`;
        container.appendChild(baseTag);
      }

      // 所有比對目標標籤
      crossSelectedTargets.forEach(key => {
        const tag = document.createElement("div");
        tag.className = "selected-tag";

        if (key.startsWith("DEPT_")) {
          const code = key.replace("DEPT_", "");
          const dObj = allDepts.find(d => d.code === code);
          const name = dObj ? dObj.name : code;
          tag.innerHTML = `[比對科別] [${code}] ${name} <span class="close-btn" onclick="removeCrossTarget('${key}')">✕</span>`;
        } else {
          const docStr = key.replace("DOC_", "");
          const [code, doc] = docStr.split("___");
          const docCode = findDocCode(doc);
          tag.innerHTML = `[比對醫師] [${code}] ${doc} ${docCode ? `(${docCode})` : ''} <span class="close-btn" onclick="removeCrossTarget('${key}')">✕</span>`;
        }
        container.appendChild(tag);
      });
    }

    function clearCrossTargets() {
      crossSelectedTargets.clear();
      renderCrossTargetTags();
      document.getElementById("cross-result-area").innerHTML = "";
    }

    function runCrossSearch() {
      if (!crossBaseDoctorKey) {
        const docSelect = document.getElementById("cross-base-doc-select");
        if (docSelect) crossBaseDoctorKey = docSelect.value;
      }
      const resultArea = document.getElementById("cross-result-area");

      if (!crossBaseDoctorKey) {
        resultArea.innerHTML = `<div class="empty-tip">請先選擇基準醫師</div>`;
        return;
      }

      const [deptCode, docName] = crossBaseDoctorKey.split("___");
      const docSlots = schedules.filter(s => s.dept_code === deptCode && s.doctor === docName);
      const docCode = findDocCode(docName);

      if (crossSelectedTargets.size === 0) {
        resultArea.innerHTML = `<div class="card" style="border-left:4px solid var(--warn-border);">
          請在上方選擇或勾選欲比對之目標科別或醫師。
        </div>`;
        return;
      }

      let html = `<div class="card" style="background:#f8fafc; border:1px solid #cbd5e1; margin-bottom:12px;">
        <div>查詢基準：<strong>[${deptCode}] ${docName} 醫師</strong> ${docCode ? `<span class="doc-code-tag">${docCode}</span>` : ''}（每週共有 ${docSlots.length} 個門診時段）</div>
      </div>`;

      const targetDepts = new Set();
      const targetDocs = new Set();
      crossSelectedTargets.forEach(t => {
        if (t.startsWith("DEPT_")) targetDepts.add(t.replace("DEPT_", ""));
        else if (t.startsWith("DOC_")) targetDocs.add(t.replace("DOC_", ""));
      });

      docSlots.sort((a,b) => {
        if (a.weekday !== b.weekday) return a.weekday - b.weekday;
        return slotRank[a.slot] - slotRank[b.slot];
      }).forEach(mySlot => {
        const matches = schedules.filter(s => {
          if (s.weekday !== mySlot.weekday || s.slot !== mySlot.slot) return false;
          if (targetDepts.has(s.dept_code)) return true;
          if (targetDocs.has(`${s.dept_code}___${s.doctor}`)) return true;
          return false;
        });

        html += `<div class="day-block">
          <div class="day-header">
            <span>📅 ${weekdayMap[mySlot.weekday]} ${formatSlot(mySlot.slot)}</span>
            <span style="font-size:0.82rem; font-weight:normal; color:#475569;">
              ${docName} 醫師：<strong style="color:#0369a1;">${mySlot.room || "看診中"}</strong> ${mySlot.note ? "("+mySlot.note+")" : ""}
            </span>
          </div>
          <div class="day-body">`;

        if (matches.length === 0) {
          html += `<div style="color:var(--muted); font-size:0.88rem; padding:4px 0;">
            所選目標於此時段無門診。
          </div>`;
        } else {
          const grouped = {};
          matches.forEach(m => {
            if (!grouped[m.dept_name]) grouped[m.dept_name] = [];
            grouped[m.dept_name].push(m);
          });

          for (let dName in grouped) {
            html += `<div style="margin-bottom:8px;">
              <strong style="font-size:0.9rem; color:#0f172a;">${dName}：</strong>`;
            grouped[dName].forEach(doc => {
              const dCode = findDocCode(doc.doctor);
              html += `<span class="doc-tag match">
                <span class="dept-code">${doc.dept_code}</span>
                <strong>${doc.doctor} 醫師</strong>
                ${dCode ? `<span class="doc-code-tag">${dCode}</span>` : ''}
                <small style="color:#64748b; margin-left:4px;">(${doc.room || "診間"}${doc.note ? " / " + doc.note : ""})</small>
              </span>`;
            });
            html += `</div>`;
          }
        }

        html += `</div></div>`;
      });

      resultArea.innerHTML = html;
    }


    // ==================== 功能 2: 醫師/科別代碼速查模組 ====================
    function initCodeSearchModule() {
      const codeDeptSelect = document.getElementById("codeDeptSelect");
      const doctorContainer = document.getElementById("doctorContainer");
      const deptHeaderBox = document.getElementById("deptHeaderBox");
      const dispDeptName = document.getElementById("dispDeptName");
      const dispDeptCode = document.getElementById("dispDeptCode");
      const codeKeywordSearch = document.getElementById("codeKeywordSearch");
      const searchResultContainer = document.getElementById("searchResultContainer");

      const deptMap = new Map();
      masterData.forEach(item => {
        if (!deptMap.has(item.dept)) {
          deptMap.set(item.dept, item.deptCode);
        }
      });

      deptMap.forEach((code, dept) => {
        const opt = document.createElement("option");
        opt.value = dept;
        opt.textContent = `[${code}] ${dept}`;
        codeDeptSelect.appendChild(opt);
      });

      codeDeptSelect.addEventListener("change", function () {
        const selectedDept = this.value;
        if (!selectedDept) {
          deptHeaderBox.style.display = "none";
          doctorContainer.innerHTML = '<div class="empty-tip" style="grid-column: 1 / -1;">請選擇科別</div>';
          return;
        }

        const docs = masterData.filter(item => item.dept === selectedDept);
        const code = docs[0].deptCode;

        dispDeptName.textContent = selectedDept;
        dispDeptCode.textContent = code;
        deptHeaderBox.style.display = "flex";
        doctorContainer.innerHTML = createDocCards(docs);
      });

      codeKeywordSearch.addEventListener("input", function () {
        filterCodeSearch();
      });
    }

    function createDocCards(items) {
      return items.map(item => `
        <div class="doc-item" onclick="showDoctorScheduleModal('${item.doc}', '${item.deptCode}', '${item.dept}', '${item.docCode || ''}')">
          <div>
            <span class="doc-name">${item.doc}</span>
            <div style="font-size: 0.75rem; color: #64748b;">${item.dept} (${item.deptCode})</div>
          </div>
          <div style="text-align: right;">
            ${item.docCode ? `<span class="doc-code">${item.docCode}</span>` : `<span class="doc-code empty">無代碼</span>`}
            <div style="font-size: 0.72rem; color: #0284c7; margin-top: 4px; font-weight: 600;">📅 查看門診 ❯</div>
          </div>
        </div>
      `).join("");
    }

    function filterCodeSearch() {
      const keyword = document.getElementById("codeKeywordSearch").value.trim().toLowerCase();
      const searchResultContainer = document.getElementById("searchResultContainer");
      if (!keyword) {
        searchResultContainer.style.display = "none";
        return;
      }

      const matches = masterData.filter(item => 
        item.dept.toLowerCase().includes(keyword) ||
        item.deptCode.toLowerCase().includes(keyword) ||
        item.doc.toLowerCase().includes(keyword) ||
        item.docCode.toLowerCase().includes(keyword)
      );

      searchResultContainer.style.display = "grid";
      if (matches.length === 0) {
        searchResultContainer.innerHTML = '<div class="empty-tip" style="grid-column: 1 / -1;">查無相符資料</div>';
      } else {
        searchResultContainer.innerHTML = createDocCards(matches);
      }
    }

    function resetCodeSearch() {
      document.getElementById("codeKeywordSearch").value = "";
      document.getElementById("searchResultContainer").style.display = "none";
    }

    // ==================== 門診時刻表彈窗邏輯 (Modal) ====================
    function showDoctorScheduleModal(docName, deptCode, deptName, docCode) {
      const modal = document.getElementById("scheduleModal");
      const titleEl = document.getElementById("modalDoctorTitle");
      const contentEl = document.getElementById("modalDoctorContent");
      if (!modal || !titleEl || !contentEl) return;

      const codeText = docCode ? `醫師代碼: ${docCode}` : "無代碼";
      titleEl.innerHTML = `👨‍⚕️ ${docName} 醫師門診時刻表`;

      // 提取該醫師於排班資料庫中的門診時段
      const docSlots = schedules.filter(s => s.doctor === docName && (deptCode ? s.dept_code === deptCode : true));

      let bodyHtml = `
        <div style="background: #f1f5f9; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; border: 1px solid #e2e8f0;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong style="color: #1e293b; font-size: 1rem;">${docName} 醫師</strong>
            <div>
              <span style="font-size: 0.78rem; background: #0284c7; color: white; padding: 2px 8px; border-radius: 12px; font-weight: 600;">[${deptCode}] ${deptName}</span>
              <span style="font-size: 0.78rem; background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 12px; font-weight: 700; font-family: monospace; margin-left: 4px;">${codeText}</span>
            </div>
          </div>
        </div>
      `;

      if (docSlots.length === 0) {
        bodyHtml += `
          <div style="text-align: center; padding: 28px 16px; color: #64748b;">
            <div style="font-size: 2.2rem; margin-bottom: 8px;">🗓️</div>
            <div style="font-weight: 700; font-size: 0.95rem; color: #334155;">此醫師目前暫無常規門診排班紀錄</div>
            <div style="font-size: 0.82rem; color: #94a3b8; margin-top: 6px;">（可能為特約門診、住院/手術照會專科，或排班資料更新中）</div>
          </div>
        `;
      } else {
        // 依星期與時段先後排序
        const sorted = [...docSlots].sort((a,b) => {
          if (a.weekday !== b.weekday) return a.weekday - b.weekday;
          return (slotRank[a.slot] || 99) - (slotRank[b.slot] || 99);
        });

        // 依星期分組
        const byDay = {};
        sorted.forEach(s => {
          if (!byDay[s.weekday]) byDay[s.weekday] = [];
          byDay[s.weekday].push(s);
        });

        bodyHtml += `<div style="display: flex; flex-direction: column; gap: 10px;">`;

        for (let w = 1; w <= 6; w++) {
          if (!byDay[w]) continue;
          const daySlots = byDay[w];

          bodyHtml += `
            <div style="border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden;">
              <div style="background: #f8fafc; padding: 8px 12px; font-weight: 700; font-size: 0.88rem; color: #334155; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                <span>📅 ${weekdayMap[w]}</span>
                <span style="font-size: 0.78rem; font-weight: normal; color: #64748b;">${daySlots.length} 個看診時段</span>
              </div>
              <div style="padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;">
          `;

          daySlots.forEach(s => {
            let slotColor = "#0284c7";
            let slotBg = "#e0f2fe";
            if (s.slot === "下午") { slotColor = "#d97706"; slotBg = "#fef3c7"; }
            else if (s.slot.includes("夜")) { slotColor = "#7c3aed"; slotBg = "#ede9fe"; }

            bodyHtml += `
              <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; background: #ffffff; border-radius: 6px; border: 1px solid #f1f5f9;">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span style="background: ${slotBg}; color: ${slotColor}; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 0.82rem;">
                    🕒 ${formatSlot(s.slot)}
                  </span>
                  <span style="font-weight: 600; font-size: 0.9rem; color: #0f172a;">
                    ${s.room || "看診中"}
                  </span>
                </div>
                ${s.note ? `<span style="font-size: 0.78rem; background: #fee2e2; color: #b91c1c; padding: 2px 6px; border-radius: 4px; font-weight: 600;">${s.note}</span>` : ''}
              </div>
            `;
          });

          bodyHtml += `</div></div>`;
        }

        bodyHtml += `
          </div>
          <div style="margin-top: 12px; text-align: right; font-size: 0.82rem; color: #64748b;">
            每週門診總計：<strong style="color: #0284c7;">${sorted.length}</strong> 個時段
          </div>
        `;
      }

      contentEl.innerHTML = bodyHtml;
      modal.classList.add("active");
    }

    function closeDoctorScheduleModal() {
      const modal = document.getElementById("scheduleModal");
      if (modal) modal.classList.remove("active");
    }

    function onModalOverlayClicked(e) {
      if (e.target && e.target.id === "scheduleModal") {
        closeDoctorScheduleModal();
      }
    }

    // 支援 ESC 鍵關閉彈窗
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") {
        closeDoctorScheduleModal();
      }
    });

    window.onload = initApp;
  </script>
</body>
</html>
