name: Daily Schedule & Suspension Notice Update

# 基於公立醫療機構資安合規與防火牆政策，全面停用境外雲端主機排程爬蟲，改由台灣在地合法環境執行
on:
  workflow_dispatch:
    inputs:
      force_update:
        description: '手動緊急執行測試 (僅供特定調試)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run schedule, doctor codes and suspension notice crawler
        run: |
          echo "啟動每日門診排班、醫師代碼與停代診公告自動更新巡檢..."
          python scripts/update_schedule.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html 門診時段交叉查詢與醫師代碼查詢系統.html assets/notices/
          if git diff --staged --quiet; then
            echo "全院資料庫與排班無任何異動，跳過提交。"
          else
            echo "檢測到排班、停代診或醫師代碼異動，正在自動提交並推播..."
            git commit -m "chore(auto): daily schedule, doctor codes & suspension notices update"
            git push
          fi
